title: sdq
description:
  en-US: A concise delayed queue written in Go and inspired by beanstalkd.
  zh-Hans: 简洁高效的 Go 延迟队列，受 beanstalkd 启发。
icon: icons/timer.svg
abbr:
  zh-Hans:
    job: "提交到队列、等待 worker 处理的一项作业。"
    Job: "提交到队列、等待 worker 处理的一项作业。"
    queue: "按就绪时间和优先级组织作业的队列。"
    Queue: "按就绪时间和优先级组织作业的队列。"
    TTR: "Time To Run，worker 保留作业后允许完成处理的最长时间。"
    worker: "从队列保留并执行作业的工作进程或 goroutine。"
    storage: "持久化作业、主题和状态转换的存储后端。"
    Storage: "持久化作业、主题和状态转换的存储后端。"
    lease: "worker 在一段时间内独占处理作业的租约。"
    reserve: "等待并取得一个就绪作业及其处理租约的操作。"
    Reserve: "等待并取得一个就绪作业及其处理租约的操作。"
    bury: "把失败作业移入 buried 状态、停止自动重试的操作。"
    Bury: "把失败作业移入 buried 状态、停止自动重试的操作。"
    buried: "作业被隔离、不会再自动进入 ready 队列的状态。"
    ready: "作业已达到执行时间并可被 worker 保留的状态。"
    release: "放弃当前租约并把作业重新安排到队列的操作。"
    broker: "协调生产者、队列存储与消费者的作业代理。"
    "idempotency key": "用于识别重复提交、避免同一业务操作重复生效的键。"
    at-least-once: "至少投递一次语义；作业可能重复执行，handler 必须可幂等处理。"
    "poison job": "持续失败、需要隔离或人工处理的作业。"
    topic: "对作业进行逻辑分类并绑定 handler 的主题。"
    WAL: "Write-Ahead Log，先写日志再更新数据以支持崩溃恢复。"
    backoff: "连续失败后逐步延长重试间隔的退避策略。"
    "side effect": "数据库写入、消息发送等会改变外部状态的操作。"
    ticker: "按固定时间间隔向 channel 发送事件的 time.Ticker。"
    delay: "作业在进入 ready 状态前需要等待的延迟时间。"
    priority: "同一时刻多个作业可执行时决定先后顺序的优先级。"
    retry: "作业失败后按策略重新进入可执行状态的重试。"
    shutdown: "停止接收新工作并等待在途操作结束的关闭过程。"
    cursor: "分页或扫描时标记当前位置、供下一次继续读取的游标。"
    durability: "进程或机器故障后数据仍可恢复的持久性保证。"
    Inspector: "只读查看队列、主题、作业状态和统计信息的检查接口。"
    SQLite: "嵌入进程、以单个数据库文件为主的关系型数据库。"
    transaction: "把一组存储更改作为原子单元提交或回滚的事务。"
    "Task API": "以具体 Go 请求和响应类型封装队列发布与处理的高层接口。"
    "typed Task API": "以具体 Go 请求和响应类型封装队列发布与处理的高层接口。"
    Payload: "随作业保存并交给 handler 的业务载荷。"
    "JSON payload": "以 JSON 编码保存的作业业务载荷。"
    "web UI": "在浏览器中查看队列状态和执行运维操作的界面。"
    restart: "进程停止后重新启动并恢复队列服务的过程。"
    "transition error": "作业状态不允许执行目标转换时返回的错误。"
